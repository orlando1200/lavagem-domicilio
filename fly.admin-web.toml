# Config de deploy do `admin-web` (Next.js) no Fly.io.
# Deploy a partir da raiz do monorepo: `flyctl deploy --config fly.admin-web.toml`
#
# Deployado em 2026-08-15: app real = giucar-admin, api real = giucar-api.
app = "giucar-admin"
primary_region = "gru"

[build]
  dockerfile = "apps/admin-web/Dockerfile"

  [build.args]
    API_URL = "https://giucar-api.fly.dev/api/v1"

[env]
  NODE_ENV = "production"
  PORT = "3003"
  API_URL = "https://giucar-api.fly.dev/api/v1"

[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
