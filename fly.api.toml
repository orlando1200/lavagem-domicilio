# Config Fly.io da API (services/api). Build context = raiz do
# monorepo (o Dockerfile copia package.json/pnpm-workspace.yaml da
# raiz), por isso este arquivo fica na raiz e nao dentro de services/api.
#
# Deployado em 2026-08-15: app real = giucar-api, banco = giucar-db
# (Postgres Fly, anexado via `flyctl postgres attach` — seta
# DATABASE_URL automaticamente como secret). NODE_ENV/ADMIN_WEB_URL/
# JWT_EXPIRES_IN/PAYMENT_GATEWAY_PROVIDER nao sao sensiveis, entao vao
# aqui em [env] (aplicado em todo `flyctl deploy`) em vez de
# `flyctl secrets set`. JWT_SECRET e REFRESH_TOKEN_SECRET SIM sao
# sensiveis e precisam ser setados via `flyctl secrets set` (nunca
# neste arquivo, que fica commitado) — ver docs/DEPLOY.md.
app = 'giucar-api'
primary_region = 'gru'

[build]
  dockerfile = 'services/api/Dockerfile'

[env]
  NODE_ENV = "production"
  JWT_EXPIRES_IN = "7d"
  PAYMENT_GATEWAY_PROVIDER = "mercadopago"
  ADMIN_WEB_URL = "https://giucar-admin.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
