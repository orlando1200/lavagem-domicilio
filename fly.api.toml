# Config de deploy do servico `api` (NestJS) no Fly.io.
# Deploy a partir da raiz do monorepo (contexto de build igual ao
# docker-compose.yml): `flyctl deploy --config fly.api.toml`
#
# `app` precisa ser um nome globalmente unico no Fly — troque antes do
# primeiro deploy (ex.: "giucar-api-staging-<seu-usuario>").
app = "giucar-api-staging"
primary_region = "gru"  # Sao Paulo — regiao mais proxima do publico-alvo (BR)

[build]
  dockerfile = "services/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  JWT_EXPIRES_IN = "7d"
  PAYMENT_GATEWAY_PROVIDER = "mercadopago"
  # ADMIN_WEB_URL: setar depois do primeiro deploy do admin-web, com a
  # URL real que o Fly atribuir (https://<app-admin-web>.fly.dev) —
  # controla o CORS em src/main.ts.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Segredos (nunca vao em fly.toml — setar via `fly secrets set`):
#   DATABASE_URL, JWT_SECRET, MERCADO_PAGO_ACCESS_TOKEN,
#   MERCADO_PAGO_PUBLIC_KEY, GOOGLE_MAPS_API_KEY, AWS_ACCESS_KEY_ID,
#   AWS_SECRET_ACCESS_KEY
# (REFRESH_TOKEN_SECRET existe no .env local mas nao e lido por
# nenhum lugar do codigo hoje — dead config, nao precisa setar.)
# Ver docs/DEPLOY.md para o passo a passo completo.
