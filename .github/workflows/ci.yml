name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'
  FLUTTER_VERSION: '3.22.0'

jobs:
  # -------------------------------------------------------------------
  # Validacao geral de sintaxe (YAML dos workflows + arquivos de config)
  # -------------------------------------------------------------------
  syntax:
    name: Syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML files
        run: |
          python3 -c "
          import sys, yaml, glob
          files = glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')
          ok = True
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fh:
                      yaml.safe_load(fh)
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'INVALID: {f} -> {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Validate docker-compose.yml
        uses: docker/setup-buildx-action@v3

      - name: Docker Compose config check
        run: docker compose -f docker-compose.yml config > /dev/null

  # -------------------------------------------------------------------
  # Backend API (NestJS)
  # -------------------------------------------------------------------
  api:
    name: API (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: syntax
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            services/api/package.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/api/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-api-${{ hashFiles('services/api/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-api-

      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Type check
        run: pnpm run type-check
        continue-on-error: true

      - name: Unit tests
        run: pnpm run test -- --ci --coverage
        continue-on-error: true

      - name: Build
        run: pnpm run build
        continue-on-error: true

  # -------------------------------------------------------------------
  # Admin Web (Next.js)
  # -------------------------------------------------------------------
  admin-web:
    name: Admin Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    needs: syntax
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            apps/admin-web/package.json

      - name: Cache node_modules and .next/cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/admin-web/node_modules
            apps/admin-web/.next/cache
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-admin-web-${{ hashFiles('apps/admin-web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-admin-web-

      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
        env:
          API_URL: http://localhost:3000/api/v1

  # -------------------------------------------------------------------
  # Mobile apps (Flutter) - DESATIVADO temporariamente
  # Os apps foram criados sem as pastas nativas (android/ios/web/...)
