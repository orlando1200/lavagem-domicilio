name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'
  FLUTTER_VERSION: '3.44.8'

jobs:
  # -------------------------------------------------------------------
  # Validacao geral de sintaxe (YAML dos workflows + arquivos de config)
  # -------------------------------------------------------------------
  syntax:
    name: Syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML files
        run: |
          python3 -c "
          import sys, yaml, glob
          files = glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')
          ok = True
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fh:
                      yaml.safe_load(fh)
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'INVALID: {f} -> {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Validate docker-compose.yml
        uses: docker/setup-buildx-action@v3

      - name: Docker Compose config check
        run: docker compose -f docker-compose.yml config > /dev/null

  # -------------------------------------------------------------------
  # Backend API (NestJS)
  # -------------------------------------------------------------------
  api:
    name: API (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: syntax
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lavagem_domicilio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lavagem_domicilio_test?schema=public
      JWT_SECRET: ci-e2e-secret
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: ci-e2e-refresh-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            services/api/package.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            services/api/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-api-${{ hashFiles('services/api/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-api-

      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm exec jest --ci --coverage

      - name: Apply migrations (e2e database)
        run: pnpm run db:migrate:prod

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

  # -------------------------------------------------------------------
  # Admin Web (Next.js)
  # -------------------------------------------------------------------
  admin-web:
    name: Admin Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    needs: syntax
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            apps/admin-web/package.json

      - name: Cache node_modules and .next/cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/admin-web/node_modules
            apps/admin-web/.next/cache
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-admin-web-${{ hashFiles('apps/admin-web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-admin-web-

      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
        env:
          API_URL: http://localhost:3000/api/v1

  # -------------------------------------------------------------------
  # Mobile apps (Flutter)
  # Os apps foram criados sem as pastas nativas (android/ios/web/...)
  # commitadas -- isso so bloqueia `flutter build`/`flutter run`, nao
  # `analyze`/`test` (rodam na Dart VM do host, sem precisar montar um
  # app nativo). Ficou desativado por mais tempo do que deveria; agora
  # que os 3 apps tem testes de verdade em test/ (antes nenhum tinha),
  # vale reativar pra pegar regressao antes do merge.
  # -------------------------------------------------------------------
  mobile:
    name: Mobile (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-client, mobile-driver, mobile-lojista]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ matrix.app }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: flutter test

