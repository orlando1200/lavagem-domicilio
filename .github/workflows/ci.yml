  #       uses: actions/cache@v4
  #       with:
  #         path: |
  #           ${{ env.PUB_CACHE }}
  #           apps/${{ matrix.app }}/.dart_tool
  #         key: ${{ runner.os }}-pub-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/pubspec.lock', matrix.app)) }}
  #         restore-keys: |
  #           ${{ runner.os }}-pub-${{ matrix.app }}-
